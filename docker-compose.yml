name: barakahfi

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: barakahfi
      POSTGRES_PASSWORD: barakahfi
      POSTGRES_DB: barakahfi
    ports:
      - '5434:5432' # 5432 is taken by a local Postgres on this machine
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U barakahfi -d barakahfi']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
